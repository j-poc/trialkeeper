[project]
name = "trialkeeper"
version = "0.1.0"
description = "Honest evaluation of backtests: pre-registered trials, deflated Sharpe, PBO via CPCV, purged CV."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["quantitative-finance", "backtesting", "overfitting", "deflated-sharpe", "multiple-testing"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trialkeeper"]
